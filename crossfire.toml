# ============================================================================
# Crossfire Configuration
# ============================================================================
#
# Providers:
#
#   One neutral model list serves every gateway. Pick a gateway with the
#   `provider` key below or the `--provider` CLI flag, and set the matching API
#   key in your environment:
#
#     opencode      OPENCODE_API_KEY       (default; https://opencode.ai/zen)
#     opencode-go   OPENCODE_API_KEY       (same key; the Go subscription is a plan on the account)
#     openrouter    OPENROUTER_API_KEY
#     synthetic     SYNTHETIC_API_KEY      (https://synthetic.new; OpenAI-compatible)
#
#   Model slugs below are the neutral (OpenRouter-style) names. Each gateway maps
#   them to its wire IDs via [providers.*.model_ids]. Slugs absent from a map are
#   passed through unchanged, so OpenRouter needs no map at all.
#
# Model selection philosophy:
#
#   Highest-frequency roles get the cheapest capable models, ordered cheapest
#   first. A default run (1 generator, a few reviewers) is therefore affordable,
#   and raising the counts adds pricier models rather than starting with them.
#
#   The frontier models are placed where they work: Opus 5.5 ($4/$20) synthesises,
#   Fable ($10/$50) reviews, and Astra ($10/$50) is the synthesis fallback.
#   Fable refuses the attribution block that synthesis requires, so it reviews and
#   Opus 5.5, which accepts the block, synthesises instead. See [models.synthesizer].
#
#   Per-mode [modes.*] sections override the global [models.*] defaults.
#   Only roles that differ from the global need to be specified.
#
#   Run 'crossfire prices' to fetch current rates from OpenRouter and models.dev.
# ============================================================================

provider = "opencode"

# ---------------------------------------------------------------------------
# OpenCode Zen (pay-as-you-go). Frontier models live here.
# ---------------------------------------------------------------------------

[providers.opencode]
api_key_env = "OPENCODE_API_KEY"
requires_session = true

[providers.opencode.model_ids]
"anthropic/claude-opus-5.5"         = "claude-opus-5-5"
"anthropic/claude-fable-5.1"        = "claude-fable-5-1"
"openai/gpt-6-astra"                = "gpt-6-astra"
"openai/gpt-6-sol"                  = "gpt-6-sol"
"openai/gpt-6-luna"                 = "gpt-6-luna"
"openai/gpt-5.6-luna"               = "gpt-5.6-luna"
"z-ai/glm-5.3"                      = "glm-5.3"
"z-ai/glm-5.3-flash"                = "glm-5.3-flash"
"deepseek/deepseek-v4.1-flash"      = "deepseek-v4.1-flash"
"moonshotai/kimi-k3"                = "kimi-k3"

# ---------------------------------------------------------------------------
# OpenCode Go ($10/mo). Open models only, so frontier slugs are substituted
# with the closest Go model to keep the same neutral bench usable.
# ---------------------------------------------------------------------------

[providers.opencode-go]
# Same key as Zen: Go is a subscription on the account, not a separate credential.
# Override here only if you somehow hold a distinct Go key.
api_key_env = "OPENCODE_API_KEY"
requires_session = true

[providers.opencode-go.model_ids]
# Go serves only gpt-6-luna, gpt-5.6-luna, glm-5.3, glm-5.3-flash and kimi-k3; everything else is
# substituted with the closest of those.
# Keep the synthesizer aliases on distinct models so fallback changes the backend.
"anthropic/claude-opus-5.5"         = "gpt-5.6-luna"
"anthropic/claude-fable-5.1"        = "glm-5.3"
"openai/gpt-6-astra"                = "kimi-k3"
"openai/gpt-6-sol"                  = "gpt-5.6-luna"
"openai/gpt-6-luna"                 = "glm-5.3-flash"
"openai/gpt-5.6-luna"               = "gpt-5.6-luna"
"z-ai/glm-5.3"                      = "glm-5.3"
"z-ai/glm-5.3-flash"                = "glm-5.3-flash"
"deepseek/deepseek-v4.1-flash"      = "glm-5.3-flash"
"moonshotai/kimi-k3"                = "kimi-k3"

# ---------------------------------------------------------------------------
# OpenRouter (neutral slugs are already OpenRouter IDs, so no map is needed).
# ---------------------------------------------------------------------------

[providers.openrouter]
api_key_env = "OPENROUTER_API_KEY"

# ---------------------------------------------------------------------------
# Synthetic (https://synthetic.new). OpenAI-compatible, so it speaks chat.
# Text roles ride the syn:* aliases, which track whatever model Synthetic
# currently routes to, so the bench survives an upstream model swap. Concrete
# open models are used only where the bench names them: GLM-5.3, Kimi-K3 and
# DeepSeek-V4.1-Flash.
# ---------------------------------------------------------------------------

[providers.synthetic]
api_key_env = "SYNTHETIC_API_KEY"

[providers.synthetic.model_ids]
"anthropic/claude-opus-5.5"         = "syn:large:text"
"anthropic/claude-fable-5.1"        = "syn:large:text"
"openai/gpt-6-astra"                = "syn:large:text"
"openai/gpt-6-sol"                  = "syn:large:text"
"openai/gpt-5.6-luna"               = "syn:large:text"
"openai/gpt-6-luna"                 = "hf:deepseek-ai/DeepSeek-V4.1-Flash"
"z-ai/glm-5.3"                      = "hf:zai-org/GLM-5.3-Flash"
"z-ai/glm-5.3-flash"                = "hf:zai-org/GLM-5.3-Flash"
"deepseek/deepseek-v4.1-flash"      = "hf:deepseek-ai/DeepSeek-V4.1-Flash"
"moonshotai/kimi-k3"                = "hf:moonshotai/Kimi-K3"

# ---------------------------------------------------------------------------
# Global defaults (fallback when a mode doesn't override a role)
# ---------------------------------------------------------------------------

[models.generators]
# Generation is the longest-output, highest-frequency role, so the expensive
# frontier models are kept out of it. Here: strongest cheap models first, so a
# default 1-generator run is both good and affordable.
names = [
    "openai/gpt-6-luna",                 # frontier quality at $0.10/$0.50 per M
    "z-ai/glm-5.3-flash",                # fast and cheap
    "openai/gpt-5.6-luna",               # cheap reasoning
    "deepseek/deepseek-v4.1-flash",      # dirt cheap
    "z-ai/glm-5.3",                      # strongest open all-rounder
    "moonshotai/kimi-k3",                # strong open, different lab
]
context_window = 200000
max_output_tokens = 24000

[models.reviewers]
# Reviewers are where the adversarial value lives, and they are the most-called
# role: cheap reasoning beats frontier prose. Ordered cheapest first, with the
# models both Zen and Go serve at the head and the window sliding one place per
# round, so a normal run never leaves that cheap, portable set. Only long runs
# reach the gateway-specific and expensive tail.
#
# Zen and Go:      gpt-6-luna, glm-5.3-flash, gpt-5.6-luna, glm-5.3, kimi-k3
# Zen only:        deepseek-v4.1-flash, gpt-6-sol, gpt-6-astra, fable-5.1 (substituted on Go)
# OpenRouter only: perplexity/sonar-reasoning-pro
# Synthetic maps every slug above onto its syn:* aliases or named open models.
names = [
    "openai/gpt-6-luna",                 # frontier quality, cheap
    "z-ai/glm-5.3-flash",                # fast, cheap
    "openai/gpt-5.6-luna",               # cheap reasoning
    "deepseek/deepseek-v4.1-flash",      # cheap, blunt
    "z-ai/glm-5.3",                      # strong open
    "moonshotai/kimi-k3",                # strong open, different lab
    "openai/gpt-6-sol",                  # mid frontier reasoning (Zen)
    "openrouter:perplexity/sonar-reasoning-pro",  # grounded reasoning (OpenRouter only)
    "openai/gpt-6-astra",                # expensive thorough critic (Zen)
    "anthropic/claude-fable-5.1",        # expensive thorough critic (Zen)
]
context_window = 200000
max_output_tokens = 20000

[models.enricher]
# Enrichment is a short rewrite, not a reasoning task. A responses-protocol model with reasoning effort
# "low" (see [limits.reasoning]) keeps it fast; a chat reasoning model burned its whole budget on thinking.
# (Big Pickle is free but the Zen API rejects non-OpenCode clients with FreeTierError, so it cannot be used here.)
names = ["openai/gpt-6-luna"]
context_window = 128000
max_output_tokens = 16000

[models.synthesizer]
# Synthesis needs the per-candidate attribution block. Fable refuses it: a safety-classifier false
# positive on instructions to keep/discard/attribute candidate content (reproduced live across many
# phrasings), so Fable reviews instead, where no such instruction is sent. Opus 5.5 accepts the block
# (verified live: end_turn and a parseable attribution line) and at $4/$20 costs a quarter of Fable/Astra.
#
# The pool rotates by round (`names[(round_num - 1) % len(names)]`) and tries the rest as fallbacks, so it
# holds exactly two models: the primary leads odd rounds (including the default third and final round) and
# the fallback leads even ones. A third entry would move the final round onto the cheap fallback.
names = [
    "anthropic/claude-opus-5.5",         # frontier synthesis; accepts the attribution block, cheaper than astra
    "openai/gpt-6-astra",                # strong multi-doc reasoning; leads even rounds, and the fallback
]
context_window = 200000
max_output_tokens = 32000

[search]
enabled = true
provider = "tavily"

[limits]
max_concurrent_requests = 10
# Frontier models on the messages/responses protocols ignore temperature; these
# values apply to the OpenAI-compatible chat models only. Generators run warm
# for candidate diversity; reviewers run cold for consistent critique.
temperature_generators = 0.7
temperature_reviewers = 0.1
temperature_synthesizer = 0.2
temperature_enricher = 0.3
# Reasoning effort applies to the responses protocol only (it lowers the default
# medium effort and therefore cost). Ignored on chat and messages protocols.
http_timeout = 240.0

[limits.reasoning]
enricher = "low"
generators = "medium"
reviewers = "low"
synthesizer = "medium"

# ============================================================================
# Mode-specific overrides
# ============================================================================

# --- Research -----------------------------------------------------------------
[modes.research.generators]
# The two perplexity entries are OpenRouter-only: they are kept when --provider openrouter and dropped
# from every other gateway, so native web-grounded research returns on OpenRouter without breaking Zen.
names = [
    "openrouter:perplexity/sonar-pro",           # native web-grounded research (OpenRouter only)
    "openrouter:perplexity/sonar-deep-research",  # multi-step research (OpenRouter only)
    "openai/gpt-6-luna",                 # grounded reasoning, cheap
    "z-ai/glm-5.3-flash",                # fast analytical angle
    "deepseek/deepseek-v4.1-flash",      # cheap
    "z-ai/glm-5.3",                      # cheap analytical angle
    "moonshotai/kimi-k3",                # long-context synthesis
]
context_window = 200000
max_output_tokens = 16000

# Synthesizer: inherits global, because research needs the best.

# --- Code ---------------------------------------------------------------------
[modes.code.generators]
names = [
    "openai/gpt-6-sol",                  # SOTA agentic code, mid price
    "openai/gpt-6-luna",                 # frontier quality, cheap
    "z-ai/glm-5.3",                      # strong open coder
    "deepseek/deepseek-v4.1-flash",      # cheap
    "moonshotai/kimi-k3",                # strong open coder
]
context_window = 200000
max_output_tokens = 16000

[modes.code.synthesizer]
names = ["openai/gpt-6-sol"]
context_window = 200000
max_output_tokens = 32000

# --- Edit ---------------------------------------------------------------------
# Generators: inherit global; editing is lighter work and needs no special pool.

[modes.edit.synthesizer]
names = ["openai/gpt-6-sol"]             # editing is light work; no need for frontier prices
context_window = 200000
max_output_tokens = 16000

# --- Check --------------------------------------------------------------------
[modes.check.generators]
names = [
    "openrouter:perplexity/sonar-pro",   # web-grounded fact-checking (OpenRouter only)
    "openai/gpt-6-luna",                 # methodical, cheap
    "z-ai/glm-5.3-flash",                # cheap
    "deepseek/deepseek-v4.1-flash",      # cheap
    "z-ai/glm-5.3",                      # cheap
    "moonshotai/kimi-k3",                # structured
]
context_window = 200000
max_output_tokens = 16000

# Synthesizer: inherits global, because accuracy needs the best.

# --- Writer -------------------------------------------------------------------
[modes.write.generators]
names = [
    "openai/gpt-6-luna",                 # strong voice, cheap
    "z-ai/glm-5.3-flash",                # cheap, different tone
    "deepseek/deepseek-v4.1-flash",      # cheap
    "z-ai/glm-5.3",                      # different register
    "moonshotai/kimi-k3",                # strong open
]
context_window = 200000
max_output_tokens = 16000

[modes.write.synthesizer]
names = [
    "anthropic/claude-opus-5.5",         # voice preservation, and it accepts the attribution block that Fable will not
    "openai/gpt-6-astra",                # fallback
]
context_window = 200000
max_output_tokens = 32000
